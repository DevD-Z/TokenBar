name: CI

# Runs on every push / pull request to main, and can be started by hand from
# the "Actions" tab. It only checks and builds the project: there is no release
# signing and no GitHub Release step (see release.yml for that).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the jobs only need to read the repository contents.
permissions:
  contents: read

# A newer run for the same branch / PR cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep these in sync with release.yml and AGENTS.md.
  #   Flutter 3.47.7 ships Dart 3.13.5, which satisfies pubspec.yaml (sdk: ^3.13.5).
  #   JDK 17 matches the Java 17 source/target in android/app/build.gradle.kts.
  FLUTTER_VERSION: "3.47.7"
  JAVA_VERSION: "17"

jobs:
  check:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        # Third-party action: pinned to a full commit SHA (tag v2.23.0).
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show tool versions
        run: flutter --version

      - name: Get dependencies (whole workspace)
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test packages

      - name: Analyze app
        run: flutter analyze

      - name: Test app
        run: flutter test

      - name: Analyze and test tokenbar_core
        working-directory: packages/tokenbar_core
        run: |
          dart analyze
          dart test

      - name: Test tokenbar_server
        working-directory: packages/tokenbar_server
        run: |
          dart analyze
          dart test

      - name: Build web
        run: flutter build web --release

  android:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: tokenbar-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release
