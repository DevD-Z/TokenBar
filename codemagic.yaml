workflows:
  ios-unsigned:
    name: TokenBar iOS - Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - antigravity_oauth
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
      vars:
        APP_NAME: "TokenBar"

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Show build environment
        script: |
          flutter --version
          dart --version
          xcodebuild -version

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies when available
        script: |
          if [ -f "$CM_BUILD_DIR/ios/Podfile" ]; then
            cd "$CM_BUILD_DIR/ios"
            pod install
          else
            echo "No ios/Podfile found. Skipping CocoaPods install."
          fi

      - name: Build iOS release without code signing
        script: |
          cd "$CM_BUILD_DIR"

          if [ -z "$ANTIGRAVITY_IOS_CLIENT_ID" ]; then
            echo "ERROR: ANTIGRAVITY_IOS_CLIENT_ID is missing."
            echo "Create/use Codemagic variable group: antigravity_oauth"
            echo "Add: ANTIGRAVITY_IOS_CLIENT_ID"
            exit 1
          fi

          case "$ANTIGRAVITY_IOS_CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *)
              echo "ERROR: ANTIGRAVITY_IOS_CLIENT_ID does not look like a Google iOS OAuth client ID."
              exit 1
              ;;
          esac

          CLIENT_PREFIX="${ANTIGRAVITY_IOS_CLIENT_ID%.apps.googleusercontent.com}"
          REVERSED_CLIENT_ID="com.googleusercontent.apps.$CLIENT_PREFIX"
          PLIST="$CM_BUILD_DIR/ios/Runner/Info.plist"

          echo "Configuring iOS OAuth URL scheme: $REVERSED_CLIENT_ID"

          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleTypeRole string Editor" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REVERSED_CLIENT_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :GIDClientID" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :GIDClientID string $ANTIGRAVITY_IOS_CLIENT_ID" "$PLIST"

          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :GIDClientID" "$PLIST"

          flutter build ios --release --no-codesign \
            --dart-define=ANTIGRAVITY_IOS_CLIENT_ID="$ANTIGRAVITY_IOS_CLIENT_ID"

      - name: Create unsigned IPA
        script: |
          cd "$CM_BUILD_DIR"

          APP_PATH="build/ios/iphoneos/Runner.app"
          IPA_DIR="build/ios/ipa"
          PAYLOAD_DIR="$IPA_DIR/Payload"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: $APP_PATH was not created."
            exit 1
          fi

          rm -rf "$IPA_DIR"
          mkdir -p "$PAYLOAD_DIR"

          cp -R "$APP_PATH" "$PAYLOAD_DIR/Runner.app"

          cd "$IPA_DIR"
          /usr/bin/zip -qry "$APP_NAME-unsigned.ipa" Payload
          rm -rf Payload

          echo "Created: $CM_BUILD_DIR/$IPA_DIR/$APP_NAME-unsigned.ipa"
          ls -lh "$CM_BUILD_DIR/$IPA_DIR"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/*.app
      - build/ios/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
